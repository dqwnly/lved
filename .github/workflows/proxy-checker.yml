# .github/workflows/proxy-checker.yml
name: Proxy Harvester & Elite Validator

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  harvest-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install aiohttp aiofiles pysocks --quiet

      - name: Harvest + validate proxies
        timeout-minutes: 22
        run: python scripts/harvest.py

      - name: Commit results
        run: |
          git config user.name  "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add proxies/
          git diff --cached --quiet || git commit -m "chore: proxy refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
